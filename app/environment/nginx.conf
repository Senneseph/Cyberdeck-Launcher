server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # keep the port in redirects

    location = / {
        return 301 /Cyberdeck-Launcher/app/index.html;
    }

    location /Cyberdeck-Launcher/app/ {
        try_files $uri /Cyberdeck-Launcher/app/index.html;
    }

    # Deny secrets / build artifacts
    location ~ /\.env { return 404; }
    location ~ /\.git { return 404; }
    location ~ /node_modules { return 404; }
    location ~ /package-lock\.json { return 404; }
    location ~ /\.dockerignore { return 404; }
}
